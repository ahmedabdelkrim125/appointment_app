name: Flutter Android Firebase Distribution

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch: 

jobs:
  distribute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Configure Gradle
        working-directory: android
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: android
          bundler-cache: true 

      - name: Run Fastlane
        working-directory: android
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DEV_APP_ID: "1:367726199888:android:b78c72c04ef8ee74d17d55"
          PROD_APP_ID: "1:367726199888:android:527cef7bcb7c8e81d17d55"
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > service-account.json
          if [ "${{ github.ref_name }}" == "main" ]; then
            bundle exec fastlane distribute_firebase flavor:production app_id:$PROD_APP_ID
          else
            bundle exec fastlane distribute_firebase flavor:development app_id:$DEV_APP_ID
          fi